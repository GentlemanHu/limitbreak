name: Feature request
description: A new quota source, executor (for example Codex), or workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: If it is a new provider or client, say which interface it needs (QuotaSource, SessionObserver, ResumeExecutor).
