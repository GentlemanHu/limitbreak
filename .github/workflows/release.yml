name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal the VERSION file (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize and publish
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Secrets cannot be referenced in `if:` directly; expose only whether they exist.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Environment
        run: |
          {
            echo "GOCACHE=$(go env GOCACHE)"
            echo "GOPATH=$(go env GOPATH)"
            echo "TMPDIR=$RUNNER_TEMP/"
          } >> "$GITHUB_ENV"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            requested="${INPUT_VERSION#v}"
          else
            requested="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$requested'"; exit 1
          fi
          if [[ "$requested" != "$file_version" ]]; then
            echo "::error::Requested version $requested does not match VERSION file ($file_version)"; exit 1
          fi
          echo "version=$requested" >> "$GITHUB_OUTPUT"
          echo "tag=v$requested" >> "$GITHUB_OUTPUT"

      - name: Verify (tests and native compile)
        run: bash scripts/verify.sh

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/limitbreak-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/limitbreak-certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "$MACOS_SIGN_IDENTITY"; then
            echo "::error::MACOS_SIGN_IDENTITY was not found in the imported certificate"; exit 1
          fi
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          export QSO_UNIVERSAL=1
          export QSO_APP_OUTPUT="$RUNNER_TEMP/out/LimitBreak.app"
          if [[ "$HAS_SIGNING" == true ]]; then
            export QSO_SIGN_IDENTITY="$MACOS_SIGN_IDENTITY"
            # Developer ID: hardened runtime (always on) plus a secure timestamp for notarization.
            export QSO_SIGN_TIMESTAMP=1
          else
            echo "::warning::No signing secrets configured; producing an ad-hoc signed, non-notarized build."
            export QSO_ALLOW_ADHOC=1
          fi
          bash scripts/build-app.sh
          echo "APP_PATH=$QSO_APP_OUTPUT" >> "$GITHUB_ENV"

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          submission="$RUNNER_TEMP/notarize/LimitBreak.zip"
          mkdir -p "$(dirname "$submission")"
          ditto -c -k --keepParent "$APP_PATH" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notarize/result.json"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notarize/result.json")"
          submission_id="$(plutil -extract id raw -o - "$RUNNER_TEMP/notarize/result.json")"
          echo "Notarization status: $status ($submission_id)"
          if [[ "$status" != Accepted ]]; then
            xcrun notarytool log "$submission_id" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          # Re-run the package checks on the stapled bundle.
          /usr/bin/python3 -I scripts/verify_app.py "$APP_PATH" universal
          echo "NOTARIZED=true" >> "$GITHUB_ENV"

      - name: Package ZIP and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          zip_name="LimitBreak-${VERSION}-universal.zip"
          /usr/bin/python3 -I scripts/archive_app.py "$APP_PATH" "$dist/$zip_name"
          (cd "$dist" && shasum -a 256 "$zip_name" > SHA256SUMS && cat SHA256SUMS)
          echo "DIST_DIR=$dist" >> "$GITHUB_ENV"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Install"
            echo
            echo "**One-line install** (downloads this release, verifies SHA256, backs up any previous version):"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${REPOSITORY}/main/scripts/install.sh | LIMITBREAK_REPO=${REPOSITORY} bash"
            echo '```'
            echo
            echo "**Manual:** download \`LimitBreak-${VERSION}-universal.zip\`, check it against \`SHA256SUMS\`"
            echo "(\`shasum -a 256 -c SHA256SUMS\`), unzip, and move \`LimitBreak.app\` to \`/Applications\`."
            echo
            echo "Requires macOS 14 or later. Universal binary (Apple Silicon and Intel)."
            echo
            if [[ "${NOTARIZED:-false}" != true ]]; then
              echo "> [!WARNING]"
              echo "> This build is **ad-hoc signed and not notarized**. If you download the ZIP with a browser,"
              echo "> macOS Gatekeeper may report that \"LimitBreak is damaged and can't be opened\". The file is not"
              echo "> damaged: the browser added the quarantine attribute to an app Apple has not notarized. After"
              echo "> moving the app to /Applications, run:"
              echo ">"
              echo "> \`xattr -dr com.apple.quarantine /Applications/LimitBreak.app\`"
              echo ">"
              echo "> Ad-hoc builds also change their code identity on every release, so you will need to re-grant"
              echo "> Accessibility permission after upgrading."
              echo
            fi
          } > "$notes"
          echo "NOTES_PATH=$notes" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LimitBreak-${{ steps.version.outputs.version }}
          path: |
            ${{ env.DIST_DIR }}/LimitBreak-*.zip
            ${{ env.DIST_DIR }}/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LimitBreak ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ env.NOTES_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.DIST_DIR }}/LimitBreak-*.zip
            ${{ env.DIST_DIR }}/SHA256SUMS

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -e "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
